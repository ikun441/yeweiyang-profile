# Install after the yeweiyang.me certificate has been issued.
server {
    listen 80;
    listen [::]:80;
    server_name yeweiyang.me;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://yeweiyang.me$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yeweiyang.me;
    root /var/www/yeweiyang-profile/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/yeweiyang.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yeweiyang.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:YWSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/yeweiyang-domain.access.log;
    error_log /var/log/nginx/yeweiyang-domain.error.log;
    add_header X-Content-Type-Options nosniff always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /revision.json { add_header Cache-Control "no-cache"; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / { try_files $uri $uri/ =404; }
}
