server {
    listen 5173 default_server;
    listen [::]:5173 default_server;
    server_name _;
    root /var/www/yeweiyang-profile/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/yeweiyang-profile.access.log;
    error_log /var/log/nginx/yeweiyang-profile.error.log;
    add_header X-Content-Type-Options nosniff always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /revision.json {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
